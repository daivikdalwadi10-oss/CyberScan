version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cybersec-db
    environment:
      POSTGRES_USER: cybersec
      POSTGRES_PASSWORD: cybersec
      POSTGRES_DB: cybersec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersec -d cybersec"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cybersec-backend
    environment:
      APP_NAME: CyberSec Platform
      ENVIRONMENT: production
      SECRET_KEY: EpGSWOVVH_cOWllTbMT050pd8lth3dhvrnACqjqp0Tw3uq81gJXfb-a3WEeKUz-i
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRES_MINUTES: 30
      REFRESH_TOKEN_EXPIRES_DAYS: 7
      DATABASE_URL: postgresql+asyncpg://cybersec:cybersec@db:5432/cybersec
      CORS_ORIGINS: https://yourdomain.com
      ALLOWED_HOSTS: yourdomain.com
      SECURITY_HEADERS_ENABLED: "true"
      HSTS_ENABLED: "true"
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW_SECONDS: 60
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: cybersec-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: cybersec-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: cybersec-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
